<div
  class="bg-surface-0/60 dark:bg-surface-0 backdrop-blur-xl rounded-3xl p-6 shadow-sm border border-surface-0/10 dark:border-surface-700/30"
>
  <h3
    class="text-lg font-bold text-surface-800 dark:text-surface-950 mb-4 flex items-center"
  >
    <i class="pi pi-tags mr-2 text-primary-500"></i>标签
  </h3>
  <div class="flex flex-wrap gap-2">
    @for (tag of tags(); track tag.name) {
      <a
        href="#"
        class="px-3 py-1.5 rounded-xl text-xs font-bold transition-all hover:-translate-y-0.5 hover:shadow-sm"
        [class]="tag.color"
      >
        # {{ tag.name }}
      </a>
    }
  </div>
</div>
