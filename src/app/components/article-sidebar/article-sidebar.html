<div
  class="bg-surface-0/50 dark:bg-surface-950/50 backdrop-blur-xl rounded-2xl shadow-sm border border-surface-0/20 dark:border-surface-700/30 overflow-hidden"
>
  <div
    class="p-3 border-b border-surface-200/50 dark:border-surface-700/50 flex gap-2"
  >
    <p-button
      icon="pi pi-plus"
      label="展开"
      (click)="expandAll()"
      styleClass="p-button-text p-button-secondary p-button-sm w-1/2 !px-1"
    />
    <p-button
      icon="pi pi-minus"
      label="折叠"
      (click)="collapseAll()"
      styleClass="p-button-text p-button-secondary p-button-sm w-1/2 !px-1"
    />
  </div>
  <p-tree
    [value]="files"
    selectionMode="single"
    (onNodeSelect)="onNodeSelect($event)"
    [propagateSelectionDown]="false"
    [propagateSelectionUp]="false"
    class="w-full bg-transparent border-none p-2 custom-glass-tree"
  >
  </p-tree>
</div>
