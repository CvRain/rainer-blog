<div class="w-full h-full p-6">
  <div class="max-w-[90rem] mx-auto">
    <div class="flex flex-col lg:flex-row items-start gap-8">
      <!-- 左侧：个人介绍 & 导航 (固定窄列) -->
      <div class="w-full lg:w-72 flex-shrink-0 space-y-6">
        <app-self-intro-card
          [userName]="userInfo().user_name"
          [userSignature]="userInfo().user_signature"
          [avatar]="userInfo().user_avatar"
          [links]="userInfo().links || []"
        ></app-self-intro-card>

        <app-category-card></app-category-card>
        <app-tag-card></app-tag-card>

        <!-- 在平板/小屏设备上显示的统计信息 (大屏隐藏) -->
        <div class="space-y-6 xl:hidden">
          <app-site-stat-card></app-site-stat-card>
          <app-calendar-card></app-calendar-card>
          <app-activity-card></app-activity-card>
        </div>
      </div>

      <!-- 中间：文章和主题 (自适应) -->
      <div class="flex-1 w-full min-w-0">
        <!-- 最近发布的文章 -->
        <div class="mb-8">
          <h2 class="text-2xl font-bold mb-4 flex items-center gap-2">
            <i class="pi pi-sparkles text-primary-500"></i>
            最近文章
          </h2>
          <div class="flex flex-wrap -mx-3">
            @for (article of articles; track article.id) {
              <div
                class="w-full sm:w-1/2 lg:w-1/2 xl:w-1/2 2xl:w-1/3 px-3 mb-6"
              >
                <app-article-card [article]="article"></app-article-card>
              </div>
            } @empty {
              <div class="w-full px-3">
                <div
                  class="bg-surface-0/60 dark:bg-surface-0 p-8 rounded-3xl text-center border border-dashed border-surface-200 dark:border-surface-700"
                >
                  <p class="text-surface-500">暂无文章</p>
                </div>
              </div>
            }
          </div>
        </div>

        <div class="mb-8">
          <h2 class="text-2xl font-bold mb-4 flex items-center gap-2">
            <i class="pi pi-palette text-primary-500"></i>
            精选主题
          </h2>
          <div class="space-y-6">
            @for (theme of themes; track theme.id) {
              <app-theme-card [theme]="theme"></app-theme-card>
            }
          </div>
        </div>
      </div>

      <!-- 右侧：统计 & 活动 (仅超大屏显示) -->
      <div class="w-full xl:w-80 flex-shrink-0 space-y-6 hidden xl:block">
        <app-activity-card></app-activity-card>
        <app-site-stat-card></app-site-stat-card>
        <app-calendar-card></app-calendar-card>
      </div>
    </div>
  </div>
</div>
