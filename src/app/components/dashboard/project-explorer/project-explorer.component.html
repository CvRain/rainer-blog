<div
  class="h-full flex flex-col bg-surface-50 dark:bg-surface-900 border-r border-surface-200 dark:border-surface-700 select-none"
>
  <!-- Title / Search Area -->
  <div
    class="p-3 border-b border-surface-200 dark:border-surface-700/50 flex flex-col gap-2"
  >
    <div class="flex items-center justify-between">
      <span class="text-xs font-bold text-surface-500 uppercase tracking-widest"
        >Explorer</span
      >
      <div class="flex gap-1">
        <button
          pButton
          icon="pi pi-folder-plus"
          class="p-button-text p-button-rounded p-button-sm w-7 h-7"
          pTooltip="New Theme"
          (click)="onCreate.emit({ type: 'theme' })"
        ></button>
        <button
          pButton
          icon="pi pi-refresh"
          class="p-button-text p-button-rounded p-button-sm w-7 h-7"
          pTooltip="Refresh"
          (click)="loadExplorerData()"
        ></button>
      </div>
    </div>
    <div class="relative w-full">
      <i
        class="pi pi-search absolute left-2 top-1/2 -translate-y-1/2 text-surface-400 text-sm"
      ></i>
      <input
        type="text"
        pInputText
        class="w-full pl-8 p-inputtext-sm bg-surface-0 dark:bg-surface-950 !border border-surface-200 dark:border-surface-800 focus:!border-primary-500 !shadow-none !rounded-md text-sm transition-colors"
        placeholder="Search..."
        [(ngModel)]="searchTerm"
        (input)="filterNodes()"
      />
    </div>
  </div>

  <!-- File Tree -->
  <div
    class="flex-1 overflow-y-auto overflow-x-hidden custom-scrollbar py-2 px-1"
  >
    <p-tree
      [value]="files"
      [(selection)]="selectedNode"
      selectionMode="single"
      (onNodeSelect)="onNodeSelection($event)"
      [contextMenu]="cm"
      (onNodeContextMenuSelect)="onNodeContextMenuSelect($event)"
      [loading]="loading"
      styleClass="w-full border-none p-0 bg-transparent text-sm"
      [indentation]="1.0"
    >
      <ng-template let-node pTemplate="default">
        <div
          class="flex items-center gap-2 py-0.5 w-full group overflow-hidden"
        >
          <!-- Icon based on type -->
          <i
            [class]="node.icon"
            [class.text-orange-400]="node.data.type === 'chapter'"
            [class.text-blue-400]="node.data.type === 'theme'"
            [class.text-surface-400]="node.data.type === 'article'"
            class="text-sm"
          ></i>

          <span
            class="truncate flex-1 text-surface-700 dark:text-surface-300 group-hover:text-primary-600 dark:group-hover:text-primary-400 transition-colors pointer-events-none"
          >
            {{ node.label }}
          </span>

          <!-- Quick Actions on hover (optional) -->
          <!-- <div class="hidden group-hover:flex items-center gap-1 bg-surface-200 dark:bg-surface-800 rounded px-1">
                        <i class="pi pi-pencil text-xs text-primary-500 hover:text-primary-700 cursor-pointer p-1"></i>
                     </div> -->
        </div>
      </ng-template>
    </p-tree>

    <!-- Empty State -->
    <div
      *ngIf="!loading && files.length === 0"
      class="flex flex-col items-center justify-center p-8 text-surface-400 opacity-60"
    >
      <i class="pi pi-folder-open text-4xl mb-2"></i>
      <span class="text-xs">No files found</span>
    </div>
  </div>
</div>

<p-contextMenu #cm [model]="menuItems"></p-contextMenu>
