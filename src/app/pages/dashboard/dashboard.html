<app-mini-header></app-mini-header>

<div
  class="min-h-[calc(100vh-64px)] w-full max-w-[1600px] mx-auto flex gap-6 p-6 overflow-hidden"
>
  <!-- 侧边栏容器 -->
  <div
    class="relative transition-all duration-300 ease-in-out overflow-hidden"
    [class.w-0]="!sidebarVisible"
    [class.w-72]="sidebarVisible"
  >
    <app-project-explorer
      (onNodeSelect)="handleFileSelect($event)"
    ></app-project-explorer>
  </div>

  <!-- 主内容区 -->
  <main
    class="flex-1 relative flex flex-col min-w-0 transition-all duration-300"
  >
    <!-- 将切换按钮移动到主内容区的左上角，类似 Notion -->
    <button
      pButton
      [icon]="sidebarVisible ? 'pi pi-angle-double-left' : 'pi pi-angle-double-right'"
      class="p-button-text p-button-rounded w-8 h-8 !absolute -left-3 top-6 z-20 bg-surface-0 shadow-sm border border-surface-200 text-surface-500 hover:text-primary-500 hover:bg-white hidden md:flex items-center justify-center transform -translate-y-1/2"
      [pTooltip]="sidebarVisible ? '收起侧边栏' : '展开侧边栏'"
      tooltipPosition="right"
      (click)="sidebarVisible = !sidebarVisible"
    ></button>

    <!-- 内容卡片：增加毛玻璃、圆角和阴影 -->
    <div
      class="flex-1 bg-surface-0/80 backdrop-blur-xl border border-surface-0/50 dark:border-surface-700/30 rounded-2xl shadow-sm hover:shadow-md transition-shadow duration-300 overflow-hidden flex flex-col pt-0 pb-6 px-6 relative"
    >
      <!-- Tabs Bar (Inserted at top of content card) -->
      <app-workspace-tabs
        *ngIf="tabs.length > 0"
        [tabs]="tabs"
        [activeTabId]="activeTabId"
        (onTabClick)="onTabClicked($event)"
        (onTabClose)="onTabClosed($event)"
        class="mb-0 -mx-6 w-[calc(100%+3rem)]"
      ></app-workspace-tabs>

      <!-- Content Area with top padding compensation if tabs exist -->
      <div class="flex-1 overflow-auto mt-4">
        <router-outlet (activate)="onChildActivate($event)"></router-outlet>
      </div>
    </div>
  </main>
</div>

<app-simple-footer></app-simple-footer>
