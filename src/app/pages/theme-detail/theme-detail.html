<div class="flex flex-col min-h-screen relative">
  <app-mini-header
    class="fixed top-4 left-0 right-0 z-50 flex justify-center pointer-events-none *:pointer-events-auto"
  ></app-mini-header>

  <app-blur-cover
    [imageUrl]="coverUrl()"
    [title]="theme.name"
    [description]="theme.description || ''"
    [socialLinks]="[]"
  >
  </app-blur-cover>

  <div
    class="theme-content px-4 py-8 max-w-4xl mx-auto w-full relative z-10 -mt-20"
  >
    <div
      class="bg-surface-0/80 dark:bg-surface-900/80 backdrop-blur-xl rounded-3xl p-6 shadow-xl border border-surface-0/20"
    >
      <div class="chapters-container flex flex-col gap-4">
        @for (chapter of theme.chapters; track chapter.id) {
        <app-chapter-bar
          [chapter]="chapter"
          (articleSelected)="onArticleSelected($event)"
        ></app-chapter-bar>
        }
      </div>
    </div>
  </div>

  <div class="mt-auto relative z-10">
    <app-footer></app-footer>
  </div>
</div>
